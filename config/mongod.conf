# ==============================================================================
# CẤU HÌNH THAM CHIẾU TIẾN TRÌNH MONGOD (Phụ lục A - Mục 9.3, 9.6, 10.2, 10.3)
# ==============================================================================

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Giới hạn cache WiredTiger khoảng 0,5 GiB cho mỗi node (trong giới hạn 2 GiB RAM/container)
      cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIpAll: true

replication:
  replSetName: rs0
  # Kích thước Oplog cố định 512 MiB theo thiết kế mục 9.6
  oplogSizeMB: 512

security:
  authorization: enabled
  keyFile: /etc/mongo-keyfile/mongo-keyfile
